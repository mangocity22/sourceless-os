<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="slGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7FF52"/>
      <stop offset="52%" stop-color="#6E62FF"/>
      <stop offset="100%" stop-color="#6051ED"/>
    </linearGradient>
    <linearGradient id="slGradRev" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7FF52"/>
      <stop offset="100%" stop-color="#7550FF"/>
    </linearGradient>
    <linearGradient id="slGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22273A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F131E" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <!-- Top paper input tray -->
  <rect x="20" y="9" width="24" height="14" rx="2.5" fill="url(#slGlass)" stroke="url(#slGrad)" stroke-width="2.4"/>
  <!-- Printer main glass body -->
  <rect x="10" y="21" width="44" height="22" rx="6" fill="url(#slGlass)" stroke="url(#slGrad)" stroke-width="2.6"/>
  <!-- Neon status LED -->
  <circle cx="46" cy="28" r="2.2" fill="#A7FF52"/>
  <!-- Output slot -->
  <line x1="18" y1="35" x2="46" y2="35" stroke="#6051ED" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round"/>
  <!-- Printed output sheet -->
  <rect x="20" y="35" width="24" height="20" rx="2.5" fill="url(#slGlass)" stroke="url(#slGradRev)" stroke-width="2.4"/>
  <line x1="25" y1="42" x2="39" y2="42" stroke="#A7FF52" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="25" y1="48" x2="35" y2="48" stroke="#E8ECFF" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
</svg>
