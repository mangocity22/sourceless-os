# SourceLess OS Anaconda Installer Profile (Fedora 45 base)

[Profile]
profile_id = sourceless
base_profile = fedora

[Profile Detection]
os_id = sourceless

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Payload]
default_source = CLOSEST_MIRROR

[Storage]
file_system_type = btrfs

[User Interface]
custom_stylesheet = /usr/share/anaconda/anaconda-gtk.css
hidden_spokes =
    PasswordSpoke
    UserSpoke
hidden_webui_pages =
    anaconda-screen-accounts
