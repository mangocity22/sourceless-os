# Unconditional SourceLess OS Anaconda WebUI configuration override
[Profile]
profile_id = sourceless

[Storage]
default_scheme = BTRFS
default_partitioning =
    / (min 1 GiB)
    /var/home (min 500 MiB)

[User Interface]
custom_stylesheet = /usr/share/anaconda/anaconda-gtk.css
hidden_spokes =
    PasswordSpoke
    UserSpoke
hidden_webui_pages =
    anaconda-screen-accounts
