# /etc/starship.toml - SourceLess OS Global Shell Prompt

# Prompt layout format
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character
"""

# Username module (always visible)
[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

# Hostname module
[hostname]
ssh_only = false
style = "bold blue"
format = "@[$hostname]($style) in "

# Current working directory module
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
format = "[$path]($style) "

# Prompt character indicator
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
