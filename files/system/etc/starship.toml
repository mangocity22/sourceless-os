# /etc/starship.toml - Sourceless OS Global Prompt

# Formatul liniei de comanda
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character
"""

# Utilizatorul (mereu vizibil)
[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

# Hostname-ul sistemului
[hostname]
ssh_only = false
style = "bold blue"
format = "@[$hostname]($style) in "

# Directorul curent
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
format = "[$path]($style) "

# Simbolul de prompt
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"