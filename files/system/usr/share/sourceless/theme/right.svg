<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <title>Liquid Glass — Start corner</title>
  <desc>100 × 100 px quarter disc, radius 100 px, centred at the bottom-left corner. Transparent background. Editable vector gradients simulate liquid glass; no live background blur. Logo area: x=30, y=34, width=36, height=36.</desc>
  <defs>
    <linearGradient id="glass" x1="5" y1="8" x2="83" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3FAFF" stop-opacity=".35"/>
      <stop offset=".28" stop-color="#DDEFFF" stop-opacity=".19"/>
      <stop offset=".62" stop-color="#96B3D0" stop-opacity=".10"/>
      <stop offset="1" stop-color="#E0F3FF" stop-opacity=".26"/>
    </linearGradient>
    <radialGradient id="upperReflection" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(17 12) rotate(46) scale(94 39)">
      <stop stop-color="white" stop-opacity=".46"/>
      <stop offset=".48" stop-color="#EFFAFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lowerReflection" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(84 92) rotate(-41) scale(49 17)">
      <stop stop-color="#D2F2FF" stop-opacity=".30"/>
      <stop offset="1" stop-color="#D2F2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".94"/>
      <stop offset=".34" stop-color="#F4FBFF" stop-opacity=".82"/>
      <stop offset=".60" stop-color="#D7ECFF" stop-opacity=".25"/>
      <stop offset=".83" stop-color="#EAF9FF" stop-opacity=".48"/>
      <stop offset="1" stop-color="white" stop-opacity=".87"/>
    </linearGradient>
    <linearGradient id="innerShadow" x1="10" y1="5" x2="100" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102438" stop-opacity=".02"/>
      <stop offset=".50" stop-color="#142C48" stop-opacity=".22"/>
      <stop offset="1" stop-color="#102438" stop-opacity=".04"/>
    </linearGradient>
    <clipPath id="silhouette"><path d="M0 100V0A100 100 0 0 1 100 100Z"/></clipPath>
  </defs>
  <g id="glass-surface" clip-path="url(#silhouette)">
    <path id="base" d="M0 100V0A100 100 0 0 1 100 100Z" fill="url(#glass)"/>
    <path id="top-reflection" d="M0 100V0A100 100 0 0 1 100 100Z" fill="url(#upperReflection)"/>
    <path id="bottom-reflection" d="M0 100V0A100 100 0 0 1 100 100Z" fill="url(#lowerReflection)"/>
    <path id="refracted-edge-shadow" d="M0 2.4A97.6 97.6 0 0 1 97.6 100" stroke="url(#innerShadow)" stroke-width="2.8"/>
    <path id="inner-light" d="M0 4.3A95.7 95.7 0 0 1 95.7 100" stroke="#EEFAFF" stroke-opacity=".16" stroke-width=".65"/>
    <!-- Radius-100 boundary. A clipped 2 px centred stroke leaves a 1 px inner rim. -->
    <path id="arc-highlight-1px" d="M0 0A100 100 0 0 1 100 100" stroke="url(#rim)" stroke-width="2"/>
  </g>
  <!-- Optional logo: insert artwork within x=30..66, y=34..70. -->
  <g id="logo"/>
</svg>
