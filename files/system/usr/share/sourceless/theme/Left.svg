<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="120" height="100" viewBox="0 0 120 100" fill="none">
  <title>Liquid Glass — Clock and date corner</title>
  <desc>120 × 100 px quarter ellipse, radii 120 × 100 px, centred at the bottom-right corner. Same palette and opacities as the Start corner, mirrored horizontally. Transparent background; editable vector gradients simulate glass. Space reserved for clock and date; no placeholder text.</desc>
  <defs>
    <linearGradient id="glass" x1="5" y1="8" x2="83" y2="100" gradientUnits="userSpaceOnUse" gradientTransform="matrix(-1.2 0 0 1 120 0)">
      <stop stop-color="#F3FAFF" stop-opacity=".35"/>
      <stop offset=".28" stop-color="#DDEFFF" stop-opacity=".19"/>
      <stop offset=".62" stop-color="#96B3D0" stop-opacity=".10"/>
      <stop offset="1" stop-color="#E0F3FF" stop-opacity=".26"/>
    </linearGradient>
    <radialGradient id="upperReflection" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="matrix(-1.2 0 0 1 120 0) translate(17 12) rotate(46) scale(94 39)">
      <stop stop-color="white" stop-opacity=".46"/>
      <stop offset=".48" stop-color="#EFFAFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lowerReflection" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="matrix(-1.2 0 0 1 120 0) translate(84 92) rotate(-41) scale(49 17)">
      <stop stop-color="#D2F2FF" stop-opacity=".30"/>
      <stop offset="1" stop-color="#D2F2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse" gradientTransform="matrix(-1.2 0 0 1 120 0)">
      <stop stop-color="white" stop-opacity=".94"/>
      <stop offset=".34" stop-color="#F4FBFF" stop-opacity=".82"/>
      <stop offset=".60" stop-color="#D7ECFF" stop-opacity=".25"/>
      <stop offset=".83" stop-color="#EAF9FF" stop-opacity=".48"/>
      <stop offset="1" stop-color="white" stop-opacity=".87"/>
    </linearGradient>
    <linearGradient id="innerShadow" x1="10" y1="5" x2="100" y2="95" gradientUnits="userSpaceOnUse" gradientTransform="matrix(-1.2 0 0 1 120 0)">
      <stop stop-color="#102438" stop-opacity=".02"/>
      <stop offset=".50" stop-color="#142C48" stop-opacity=".22"/>
      <stop offset="1" stop-color="#102438" stop-opacity=".04"/>
    </linearGradient>
    <clipPath id="silhouette"><path d="M120 100V0A120 100 0 0 0 0 100Z"/></clipPath>
  </defs>
  <g id="glass-surface" clip-path="url(#silhouette)">
    <path id="base" d="M120 100V0A120 100 0 0 0 0 100Z" fill="url(#glass)"/>
    <path id="top-reflection" d="M120 100V0A120 100 0 0 0 0 100Z" fill="url(#upperReflection)"/>
    <path id="bottom-reflection" d="M120 100V0A120 100 0 0 0 0 100Z" fill="url(#lowerReflection)"/>
    <path id="refracted-edge-shadow" d="M120 2.4A117.12 97.6 0 0 0 2.88 100" stroke="url(#innerShadow)" stroke-width="2.8"/>
    <path id="inner-light" d="M120 4.3A114.84 95.7 0 0 0 5.16 100" stroke="#EEFAFF" stroke-opacity=".16" stroke-width=".65"/>
    <!-- Ellipse boundary, radii 120 × 100 px. A clipped 2 px centred stroke leaves a 1 px inner rim. -->
    <path id="arc-highlight-1px" d="M120 0A120 100 0 0 0 0 100" stroke="url(#rim)" stroke-width="2"/>
  </g>
  <!-- Clock above, date below: suggested content area x=52..104, y=46..80. -->
  <g id="clock-and-date"/>
</svg>
