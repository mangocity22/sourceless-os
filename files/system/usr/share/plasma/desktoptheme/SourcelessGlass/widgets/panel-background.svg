    <rect x="0" y="24" width="1.2" height="4" fill="#ffffff" fill-opacity="0.38" />
  </g>

  <g id="center">
    <rect x="24" y="24" width="32" height="4" fill="#141820" fill-opacity="0.28" />
  </g>

  <g id="right">
    <rect x="56" y="24" width="24" height="4" fill="#141820" fill-opacity="0.28" />
    <rect x="78.8" y="24" width="1.2" height="4" fill="#ffffff" fill-opacity="0.38" />
  </g>

  <g id="bottomleft">
    <path d="M 24,52 A 24,24 0 0 1 0,28 L 24,28 Z" fill="#141820" fill-opacity="0.28" />
    <path d="M 24,52 A 24,24 0 0 1 0,28 L 1.2,28 A 22.8,22.8 0 0 0 24,50.8 Z" fill="#ffffff" fill-opacity="0.38" />
  </g>

  <g id="bottom">
    <rect x="24" y="28" width="32" height="24" fill="#141820" fill-opacity="0.28" />
    <rect x="24" y="50.8" width="32" height="1.2" fill="#ffffff" fill-opacity="0.38" />
  </g>

  <g id="bottomright">
    <path d="M 80,28 A 24,24 0 0 1 56,52 L 56,28 Z" fill="#141820" fill-opacity="0.28" />
    <path d="M 80,28 A 24,24 0 0 1 56,52 L 56,50.8 A 22.8,22.8 0 0 0 78.8,28 Z" fill="#ffffff" fill-opacity="0.38" />
  </g>

  <!-- ==================== 9-SLICE KWIN BLUR MASK (PURE PATHS) ==================== -->
  <path id="mask-topleft" d="M 100,24 A 24,24 0 0 1 124,0 L 124,24 Z" fill="#000000" fill-opacity="1" />
  <rect id="mask-top" x="124" y="0" width="32" height="24" fill="#000000" fill-opacity="1" />
  <path id="mask-topright" d="M 156,0 A 24,24 0 0 1 180,24 L 156,24 Z" fill="#000000" fill-opacity="1" />

  <rect id="mask-left" x="100" y="24" width="24" height="4" fill="#000000" fill-opacity="1" />
  <rect id="mask-center" x="124" y="24" width="32" height="4" fill="#000000" fill-opacity="1" />
  <rect id="mask-right" x="156" y="24" width="24" height="4" fill="#000000" fill-opacity="1" />

  <path id="mask-bottomleft" d="M 124,52 A 24,24 0 0 1 100,28 L 124,28 Z" fill="#000000" fill-opacity="1" />
  <rect id="mask-bottom" x="124" y="28" width="32" height="24" fill="#000000" fill-opacity="1" />
