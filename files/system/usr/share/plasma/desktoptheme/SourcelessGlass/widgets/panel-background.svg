    <rect x="24" y="0" width="32" height="1.2" fill="#ffffff" fill-opacity="0.38" />
  </g>

  <g id="topright">
    <path d="M 56,0 A 24,24 0 0 1 80,24 L 56,24 Z" fill="#141820" fill-opacity="0.28" />
    <path d="M 56,0 A 24,24 0 0 1 80,24 L 78.8,24 A 22.8,22.8 0 0 0 56,1.2 Z" fill="#ffffff" fill-opacity="0.38" />
  </g>

  <g id="left">
