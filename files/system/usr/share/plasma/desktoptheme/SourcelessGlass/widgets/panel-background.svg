<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">

  <!-- ==================== HINTS ==================== -->
  <rect id="hint-apply-blur-behind" x="0" y="90" width="8" height="8" fill="#ff00ff" />
  <rect id="hint-stretch-borders" x="12" y="90" width="8" height="8" fill="#ff00ff" />
  <!-- Margini de 2px sus/jos ca să nu micșoreze iconița de Start -->
  <rect id="hint-top-margin" x="38" y="0" width="4" height="2" fill="#ff00ff" />
  <rect id="hint-bottom-margin" x="38" y="50" width="4" height="2" fill="#ff00ff" />
  <rect id="hint-left-margin" x="0" y="24" width="12" height="4" fill="#ff00ff" />
  <rect id="hint-right-margin" x="68" y="24" width="12" height="4" fill="#ff00ff" />

  <!-- ==================== 9-SLICE VISUAL (PURE PATHS, ZERO CLIPPATH) ==================== -->
  <g id="topleft">
    <path d="M 0,24 A 24,24 0 0 1 24,0 L 24,24 Z" fill="#141820" fill-opacity="0.28" />
    <path d="M 0,24 A 24,24 0 0 1 24,0 L 24,1.2 A 22.8,22.8 0 0 0 1.2,24 Z" fill="#ffffff" fill-opacity="0.38" />
  </g>

  <g id="top">
