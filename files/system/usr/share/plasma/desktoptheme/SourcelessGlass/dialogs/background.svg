<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="slBorder" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0%" stop-color="#A7FF52" stop-opacity="0.90" />
      <stop offset="50%" stop-color="#6E62FF" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#6054F2" stop-opacity="0.90" />
    </linearGradient>
  </defs>

  <!-- HINTS -->
  <rect id="hint-apply-blur-behind" x="0" y="190" width="8" height="8" fill="#ff00ff" />
  <rect id="hint-stretch-borders" x="12" y="190" width="8" height="8" fill="#ff00ff" />
  <!-- Margini interne de 24px (aliniate cu raza colturilor) ca butoanele din colt sa nu iasa din chenar -->
  <rect id="hint-top-margin" x="98" y="0" width="4" height="24" fill="#ff00ff" />
  <rect id="hint-bottom-margin" x="98" y="176" width="4" height="24" fill="#ff00ff" />
  <rect id="hint-left-margin" x="0" y="98" width="24" height="4" fill="#ff00ff" />
  <rect id="hint-right-margin" x="176" y="98" width="24" height="4" fill="#ff00ff" />

  <!-- 9-SLICE VISUAL (FARA CLIPPATH) -->
  <!-- Colț stânga-sus (Rază 24px) -->
  <g id="topleft">
    <path d="M 0,24 A 24,24 0 0 1 24,0 L 24,24 Z" fill="#101420" fill-opacity="0.62" />
    <path d="M 0,24 A 24,24 0 0 1 24,0 L 24,1.5 A 22.5,22.5 0 0 0 1.5,24 Z" fill="url(#slBorder)" />
  </g>
  <!-- Latura sus -->
  <g id="top">
    <rect x="24" y="0" width="152" height="24" fill="#101420" fill-opacity="0.62" />
    <rect x="24" y="0" width="152" height="1.5" fill="url(#slBorder)" />
  </g>
  <!-- Colț dreapta-sus -->
  <g id="topright">
    <path d="M 176,0 A 24,24 0 0 1 200,24 L 176,24 Z" fill="#101420" fill-opacity="0.62" />
    <path d="M 176,0 A 24,24 0 0 1 200,24 L 198.5,24 A 22.5,22.5 0 0 0 176,1.5 Z" fill="url(#slBorder)" />
  </g>
  <!-- Latura stânga -->
  <g id="left">
    <rect x="0" y="24" width="24" height="152" fill="#101420" fill-opacity="0.62" />
    <rect x="0" y="24" width="1.5" height="152" fill="url(#slBorder)" />
  </g>
  <!-- Centru -->
  <g id="center">
    <rect x="24" y="24" width="152" height="152" fill="#101420" fill-opacity="0.62" />
  </g>
  <!-- Latura dreapta -->
  <g id="right">
    <rect x="176" y="24" width="24" height="152" fill="#101420" fill-opacity="0.62" />
    <rect x="198.5" y="24" width="1.5" height="152" fill="url(#slBorder)" />
  </g>
  <!-- Colț stânga-jos -->
  <g id="bottomleft">
    <path d="M 24,200 A 24,24 0 0 1 0,176 L 24,176 Z" fill="#101420" fill-opacity="0.62" />
    <path d="M 24,200 A 24,24 0 0 1 0,176 L 1.5,176 A 22.5,22.5 0 0 0 24,198.5 Z" fill="url(#slBorder)" />
  </g>
  <!-- Latura jos -->
  <g id="bottom">
    <rect x="24" y="176" width="152" height="24" fill="#101420" fill-opacity="0.62" />
    <rect x="24" y="198.5" width="152" height="1.5" fill="url(#slBorder)" />
  </g>
  <!-- Colț dreapta-jos -->
  <g id="bottomright">
    <path d="M 200,176 A 24,24 0 0 1 176,200 L 176,176 Z" fill="#101420" fill-opacity="0.62" />
    <path d="M 200,176 A 24,24 0 0 1 176,200 L 176,198.5 A 22.5,22.5 0 0 0 198.5,176 Z" fill="url(#slBorder)" />
  </g>

  <!-- 9-SLICE KWIN BLUR MASK (Pentru efectul de blur in spate) -->
  <path id="mask-topleft" d="M 224,24 A 24,24 0 0 1 248,0 L 248,24 Z" fill="#000000" fill-opacity="1" transform="translate(0, 0)" />
  <rect id="mask-top" x="248" y="0" width="152" height="24" fill="#000000" fill-opacity="1" />
  <path id="mask-topright" d="M 400,0 A 24,24 0 0 1 424,24 L 400,24 Z" fill="#000000" fill-opacity="1" />
  <rect id="mask-left" x="224" y="24" width="24" height="152" fill="#000000" fill-opacity="1" />
  <rect id="mask-center" x="248" y="24" width="152" height="152" fill="#000000" fill-opacity="1" />
  <rect id="mask-right" x="400" y="24" width="24" height="152" fill="#000000" fill-opacity="1" />
  <path id="mask-bottomleft" d="M 248,200 A 24,24 0 0 1 224,176 L 248,176 Z" fill="#000000" fill-opacity="1" />
  <rect id="mask-bottom" x="248" y="176" width="152" height="24" fill="#000000" fill-opacity="1" />
  <path id="mask-bottomright" d="M 424,176 A 24,24 0 0 1 400,200 L 400,176 Z" fill="#000000" fill-opacity="1" />
</svg>
