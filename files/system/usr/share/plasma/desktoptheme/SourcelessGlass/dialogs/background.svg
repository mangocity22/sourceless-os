<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- HINTS -->
  <rect id="hint-apply-blur-behind" x="0" y="190" width="8" height="8" fill="#ff00ff" />
  <rect id="hint-stretch-borders" x="12" y="190" width="8" height="8" fill="#ff00ff" />
  <!-- Margini interne (padding) pentru continut (calendarul in sine) -->
  <rect id="hint-top-margin" x="98" y="0" width="4" height="20" fill="#ff00ff" />
  <rect id="hint-bottom-margin" x="98" y="180" width="4" height="20" fill="#ff00ff" />
  <rect id="hint-left-margin" x="0" y="98" width="20" height="4" fill="#ff00ff" />
  <rect id="hint-right-margin" x="180" y="98" width="20" height="4" fill="#ff00ff" />

  <!-- 9-SLICE VISUAL (FARA CLIPPATH) -->
  <!-- Colț stânga-sus (Rază 24px) -->
  <g id="topleft">
    <path d="M 0,24 A 24,24 0 0 1 24,0 L 24,24 Z" fill="#141820" fill-opacity="0.28" />
    <path d="M 0,24 A 24,24 0 0 1 24,0 L 24,1.2 A 22.8,22.8 0 0 0 1.2,24 Z" fill="#ffffff" fill-opacity="0.38" />
  </g>
  <!-- Latura sus -->
  <g id="top">
    <rect x="24" y="0" width="152" height="24" fill="#141820" fill-opacity="0.28" />
    <rect x="24" y="0" width="152" height="1.2" fill="#ffffff" fill-opacity="0.38" />
  </g>
  <!-- Colț dreapta-sus -->
  <g id="topright">
    <path d="M 176,0 A 24,24 0 0 1 200,24 L 176,24 Z" fill="#141820" fill-opacity="0.28" />
    <path d="M 176,0 A 24,24 0 0 1 200,24 L 198.8,24 A 22.8,22.8 0 0 0 176,1.2 Z" fill="#ffffff" fill-opacity="0.38" />
  </g>
  <!-- Latura stânga -->
  <g id="left">
    <rect x="0" y="24" width="24" height="152" fill="#141820" fill-opacity="0.28" />
    <rect x="0" y="24" width="1.2" height="152" fill="#ffffff" fill-opacity="0.38" />
  </g>
  <!-- Centru -->
  <g id="center">
    <rect x="24" y="24" width="152" height="152" fill="#141820" fill-opacity="0.28" />
  </g>
  <!-- Latura dreapta -->
  <g id="right">
    <rect x="176" y="24" width="24" height="152" fill="#141820" fill-opacity="0.28" />
    <rect x="198.8" y="24" width="1.2" height="152" fill="#ffffff" fill-opacity="0.38" />
  </g>
  <!-- Colț stânga-jos -->
  <g id="bottomleft">
    <path d="M 24,200 A 24,24 0 0 1 0,176 L 24,176 Z" fill="#141820" fill-opacity="0.28" />
    <path d="M 24,200 A 24,24 0 0 1 0,176 L 1.2,176 A 22.8,22.8 0 0 0 24,198.8 Z" fill="#ffffff" fill-opacity="0.38" />
  </g>
  <!-- Latura jos -->
  <g id="bottom">
    <rect x="24" y="176" width="152" height="24" fill="#141820" fill-opacity="0.28" />
    <rect x="24" y="198.8" width="152" height="1.2" fill="#ffffff" fill-opacity="0.38" />
  </g>
  <!-- Colț dreapta-jos -->
  <g id="bottomright">
    <path d="M 200,176 A 24,24 0 0 1 176,200 L 176,176 Z" fill="#141820" fill-opacity="0.28" />
    <path d="M 200,176 A 24,24 0 0 1 176,200 L 176,198.8 A 22.8,22.8 0 0 0 198.8,176 Z" fill="#ffffff" fill-opacity="0.38" />
  </g>

  <!-- 9-SLICE KWIN BLUR MASK (Pentru efectul de blur in spate) -->
  <path id="mask-topleft" d="M 224,24 A 24,24 0 0 1 248,0 L 248,24 Z" fill="#000000" fill-opacity="1" transform="translate(0, 0)" />
  <rect id="mask-top" x="248" y="0" width="152" height="24" fill="#000000" fill-opacity="1" />
  <path id="mask-topright" d="M 400,0 A 24,24 0 0 1 424,24 L 400,24 Z" fill="#000000" fill-opacity="1" />
  <rect id="mask-left" x="224" y="24" width="24" height="152" fill="#000000" fill-opacity="1" />
  <rect id="mask-center" x="248" y="24" width="152" height="152" fill="#000000" fill-opacity="1" />
  <rect id="mask-right" x="400" y="24" width="24" height="152" fill="#000000" fill-opacity="1" />
  <path id="mask-bottomleft" d="M 248,200 A 24,24 0 0 1 224,176 L 248,176 Z" fill="#000000" fill-opacity="1" />
  <rect id="mask-bottom" x="248" y="176" width="152" height="24" fill="#000000" fill-opacity="1" />
  <path id="mask-bottomright" d="M 424,176 A 24,24 0 0 1 400,200 L 400,176 Z" fill="#000000" fill-opacity="1" />
</svg>