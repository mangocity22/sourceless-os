---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Image metadata and target registry details (published to updates.srcdev.site/sourceless/<name>)
name: sourceless-os
description: Hardened immutable desktop OS image (SourceLess OS) with KDE Plasma 6 and built-in security controls.

# Base OCI image and tag used as the starting layer
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

# Build modules executed sequentially in order (heavy package layers first to maximize Podman cache)
modules:
  # 1. Install security tooling, desktop utilities, Qt6/KF6 build deps, and Live ISO packages; remove unmanaged updaters
  - type: dnf
    install:
      packages:
        - audit
        - openssl
        - gnutls-utils
        - nftables
        - policycoreutils-python-utils
        - tcpdump
        - micro
        - fastfetch
        - https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-0.x86_64.rpm
        - zenity
        - plasma-discover
        - plasma-discover-flatpak
        - inotify-tools
        - bubblewrap
        - jq
        - curl
        - yara
        - libnotify
        - kinfocenter
        - konsole
        - p7zip
        - p7zip-plugins
        - grub2-tools-extra
        - kvantum
        - kvantum-qt5
        - python3-pyqt6
        - gcc-c++
        - cmake
        - extra-cmake-modules
        - qt6-qtbase-devel
        - qt6-qtdeclarative-devel
        - kf6-kcoreaddons-devel
        - kf6-ki18n-devel
        - kf6-kirigami-devel
        - kf6-kcmutils-devel
        - qt6-qtwayland-devel
        - qt6-qtsvg
        - kf6-qqc2-desktop-style
        - orca
        - cups
        - cups-filters
        - system-config-printer-udev
        - sddm
        - sddm-wayland-plasma
        - dracut-live
        - livesys-scripts
        - anaconda-live
        - anaconda-webui
        - grub2-efi-x64
        - grub2-efi-x64-cdboot
        - grub2-pc-modules
        - shim-x64
        - btrfs-progs
        - e2fsprogs
        - dosfstools
        - xfsprogs
        - skopeo
        - podman

    remove:
      packages:
        - firefox
        - firefox-langpacks
        - plasma-discover-backends-fwupd
        - fwupd
        - plasma-discover-packagekit
        - plasma-discover-offline-updates
        - PackageKit

  # 2. Configure verified Flathub Flatpaks for all users and enable user-scope Flathub remote
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal
      - scope: user

  # 3. Install Cosign container verification policies and keys
  - type: signing

  # 4. Overlay custom system configs, scripts, systemd units, themes, and wallpapers onto /
  - type: files
    files:
      - source: system
        destination: /

  # 5. Enable Sourceless security/desktop services and mask conflicting upstream units
  - type: systemd
    system:
      enabled:
        - auditd.service
        - sourceless-client.service
        - sourceless-flatpak-update.timer
        - sourceless-shield.service
        - sourceless-quarantine-purge.timer
        - sourceless-update-stage.timer
        - sourceless-update-apply.service
        - dev-shm.mount
        - cups.service
        - sddm.service
      disabled:
        - fedora-atomic-desktop-appstream-cache-refresh.service
        - flatpak-add-fedora-repos.service
        - plasmalogin.service

  # 6. Execute post-install lockdown, theme cleanup, and native Control Center compilation scripts
  - type: script
    scripts:
      - setup-permissions.sh
      - clean-default-themes.sh
      - build-control-center.sh

  # 7. Enforce kernel integrity lockdown and quiet graphical boot splash
  - type: kargs
    kargs:
      - lockdown=integrity
      - quiet
      - splash
