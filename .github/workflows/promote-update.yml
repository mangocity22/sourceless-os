name: Promote Update to Stable

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Source OCI tag to promote to the client :stable channel"
        type: string
        required: true
        default: "testing"

jobs:
  promote:
    name: Promote OCI Image to Stable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Copy Image to Stable and Sign Digest
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SOURCE_TAG="${{ github.event.inputs.source_tag }}"
          SRC_REF="ghcr.io/${IMAGE_OWNER}/sourceless-os:${SOURCE_TAG}"
          STABLE_REF="ghcr.io/${IMAGE_OWNER}/sourceless-os:stable"

          echo "$GH_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy --all "docker://${SRC_REF}" "docker://${STABLE_REF}"

          STABLE_DIGEST=$(skopeo inspect "docker://${STABLE_REF}" | jq -r '.Digest')
          echo "Promoted ${SRC_REF} -> ${STABLE_REF} (${STABLE_DIGEST})"

          if [ -n "$COSIGN_PRIVATE_KEY" ] && [ -n "$STABLE_DIGEST" ] && [ "$STABLE_DIGEST" != "null" ]; then
            echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "ghcr.io/${IMAGE_OWNER}/sourceless-os@${STABLE_DIGEST}"
          fi
