name: Promote Update to Stable

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Source OCI tag to promote to the client :stable channel"
        type: string
        required: true
        default: "testing"

jobs:
  promote:
    name: Promote OCI Image to Stable
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Copy Image to Stable and Sign Digest
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          REGISTRY_HOST="updates.srcdev.site"
          IMAGE_REPO="updates.srcdev.site/sourceless/sourceless-os"
          SOURCE_TAG="${{ github.event.inputs.source_tag }}"
          SRC_REF="${IMAGE_REPO}:${SOURCE_TAG}"
          STABLE_REF="${IMAGE_REPO}:stable"

          printf '%s' "$REGISTRY_PASSWORD" | skopeo login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
          skopeo copy --all "docker://${SRC_REF}" "docker://${STABLE_REF}"

          STABLE_DIGEST=$(skopeo inspect "docker://${STABLE_REF}" | jq -r '.Digest')
          echo "Promoted ${SRC_REF} -> ${STABLE_REF} (${STABLE_DIGEST})"

          if [ -n "$COSIGN_PRIVATE_KEY" ] && [ -n "$STABLE_DIGEST" ] && [ "$STABLE_DIGEST" != "null" ]; then
            printf '%s' "$REGISTRY_PASSWORD" | cosign login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE_REPO}@${STABLE_DIGEST}"
          fi
