name: bluebuild

on:
  # Trigger testing image build on pushes (skipping documentation-only changes)
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      promote_to_stable:
        description: "Also publish this build directly to the :stable client channel"
        type: boolean
        required: false
        default: false

concurrency:
  # Ensure only one build runs per workflow and branch/ref at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      # Build, sign with Cosign, and push the OCI image via BlueBuild GitHub Action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          registry: updates.srcdev.site
          registry_namespace: sourceless
          registry_username: ${{ secrets.REGISTRY_USER }}
          registry_token: ${{ secrets.REGISTRY_PASSWORD }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          pr_event_number: ${{ github.event.number }}
          build_opts: "--build-driver podman"

      # Tag testing channel for validation; promote to stable only when explicitly requested
      - name: Tag Testing Channel (and Optional Stable Channel)
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          REGISTRY_HOST="updates.srcdev.site"
          IMAGE_REPO="updates.srcdev.site/sourceless/sourceless-os"
          SRC_IMG="docker://${IMAGE_REPO}:latest"
          TEST_IMG="docker://${IMAGE_REPO}:testing"
          STABLE_IMG="docker://${IMAGE_REPO}:stable"
          AUTH_FILE="${RUNNER_TEMP}/skopeo-auth.json"
          trap 'rm -f "$AUTH_FILE"' EXIT

          printf '%s' "$REGISTRY_PASSWORD" | skopeo login --authfile "$AUTH_FILE" "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
          skopeo copy --authfile "$AUTH_FILE" --all "$SRC_IMG" "$TEST_IMG"

          if [ "${{ github.event.inputs.promote_to_stable }}" = "true" ] || ! skopeo inspect --authfile "$AUTH_FILE" "$STABLE_IMG" >/dev/null 2>&1; then
            skopeo copy --authfile "$AUTH_FILE" --all "$SRC_IMG" "$STABLE_IMG"
          fi

      # Guard persistent self-hosted runner disk space without discarding build cache prematurely
      - name: Guard Runner Disk Space
        if: always()
        run: |
          sudo rm -f "/run/containers/$(id -u)/auth.json" 2>/dev/null || true
          DISK_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          echo "Root filesystem usage: ${DISK_PCT}%"
          if [ "${DISK_PCT:-0}" -gt 75 ]; then
            echo "Disk usage above 75%; pruning unused Podman/Buildah storage..."
            sudo podman system prune --all --force 2>/dev/null || true
            sudo buildah rmi --prune 2>/dev/null || true
            df -h /
          fi
