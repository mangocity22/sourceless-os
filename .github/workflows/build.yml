name: bluebuild

on:
  # Daily scheduled rebuild at 06:00 UTC (after upstream ublue images publish)
  schedule:
    - cron: "00 06 * * *"
  # Trigger image build on pushes (skipping documentation-only changes)
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  # Ensure only one build runs per workflow and branch/ref at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      # Build, sign with Cosign, and push the OCI image via BlueBuild GitHub Action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
