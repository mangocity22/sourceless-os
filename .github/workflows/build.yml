name: bluebuild

on:
  # Trigger testing image build on pushes (skipping documentation-only changes)
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      promote_to_stable:
        description: "Also publish this build directly to the :stable client channel"
        type: boolean
        required: false
        default: false

concurrency:
  # Ensure only one build runs per workflow and branch/ref at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      # Build, sign with Cosign, and push the OCI image via BlueBuild GitHub Action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

      # Tag testing channel for validation; promote to stable only when explicitly requested
      - name: Tag Testing Channel (and Optional Stable Channel)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SRC_IMG="docker://ghcr.io/${IMAGE_OWNER}/sourceless-os:latest"
          TEST_IMG="docker://ghcr.io/${IMAGE_OWNER}/sourceless-os:testing"
          STABLE_IMG="docker://ghcr.io/${IMAGE_OWNER}/sourceless-os:stable"

          echo "$GH_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy --all "$SRC_IMG" "$TEST_IMG"

          if [ "${{ github.event.inputs.promote_to_stable }}" = "true" ]; then
            skopeo copy --all "$SRC_IMG" "$STABLE_IMG"
          fi
