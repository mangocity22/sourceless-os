name: Build ISO

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "Also split into 7z volumes and publish to GitHub Releases (slower WAN upload)"
        type: boolean
        required: false
        default: false

concurrency:
  group: build-iso-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: self-hosted
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Check runner disk space and prune stale container layers only when usage exceeds 70%
      - name: Check Runner Disk Space
        run: |
          echo "Runner disk usage before build:"
          df -h /
          DISK_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "${DISK_PCT:-0}" -gt 70 ]; then
            echo "Disk usage above 70%; pruning unused container images..."
            sudo podman system prune --all --force 2>/dev/null || true
            sudo docker system prune --all --force --volumes 2>/dev/null || true
            df -h /
          fi

      # 2. Target self-hosted Zot registry image and detect Fedora VERSION_ID
      - name: Detect Image Metadata
        id: meta
        run: |
          IMAGE_NAME="updates.srcdev.site/sourceless/sourceless-os:latest"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          sudo podman pull "$IMAGE_NAME"
          FEDORA_VER=$(sudo podman run --rm "$IMAGE_NAME" sh -c 'grep -E "^VERSION_ID=" /etc/os-release | cut -d= -f2 | tr -d "\""')
          if [ -z "$FEDORA_VER" ]; then
            FEDORA_VER="45"
          fi
          echo "Detected Fedora VERSION_ID=${FEDORA_VER}"
          echo "version=${FEDORA_VER}" >> "$GITHUB_OUTPUT"

      # 3. Build 2-in-1 Live + Installer ISO via Titanoboa (ublue-os/titanoboa)
      - name: Build 2-in-1 Live ISO (Titanoboa)
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          iso-dest: ${{ runner.temp }}/sourceless-os-live.iso

      # 4. Guard runner disk space without wiping cached BlueBuild layers unless usage exceeds 75%
      - name: Guard Runner Disk Space
        run: |
          DISK_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          echo "Root filesystem usage after ISO build: ${DISK_PCT}%"
          if [ "${DISK_PCT:-0}" -gt 75 ]; then
            echo "Disk usage above 75%; pruning unused Podman/Docker storage..."
            sudo podman system prune --all --force 2>/dev/null || true
            sudo docker system prune --all --force 2>/dev/null || true
            df -h /
          fi

      # 5. Publish raw ISO + SHA256 directly over Proxmox LAN to LXC 106 (updates.srcdev.site/iso/)
      - name: Publish ISO to Self-Hosted Server (LXC 106)
        run: |
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          ISO_DIR="$(dirname "$ISO_PATH")"
          ISO_FILE="$(basename "$ISO_PATH")"
          KEY_PATH="${HOME}/.ssh/iso_upload_ed25519"
          REMOTE_HOST="iso-upload@192.168.1.158"
          REMOTE_DIR="/var/www/sourceless-iso"

          if [ ! -f "$KEY_PATH" ]; then
            echo "ERROR: Missing SSH deploy key at ${KEY_PATH} for ${REMOTE_HOST}" >&2
            exit 1
          fi

          sudo chown -R "$USER:$USER" "$ISO_DIR"
          cd "$ISO_DIR"

          sha256sum "$ISO_FILE" > "${ISO_FILE}.sha256"
          ISO_SHA256="$(cut -d' ' -f1 "${ISO_FILE}.sha256")"
          ISO_SIZE="$(ls -lh "$ISO_FILE" | awk '{print $5}')"
          BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat << EOF > build-info.txt
          built_utc=${BUILD_UTC}
          commit=${{ github.sha }}
          fedora_version=${{ steps.meta.outputs.version }}
          image=${{ steps.meta.outputs.image }}
          iso_file=${ISO_FILE}
          iso_size=${ISO_SIZE}
          sha256=${ISO_SHA256}
          EOF

          SSH_OPTS=(-i "$KEY_PATH" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          scp "${SSH_OPTS[@]}" "$ISO_FILE" "${REMOTE_HOST}:${REMOTE_DIR}/${ISO_FILE}.tmp"
          scp "${SSH_OPTS[@]}" "${ISO_FILE}.sha256" "${REMOTE_HOST}:${REMOTE_DIR}/${ISO_FILE}.sha256.tmp"
          scp "${SSH_OPTS[@]}" "build-info.txt" "${REMOTE_HOST}:${REMOTE_DIR}/build-info.txt.tmp"
          ssh "${SSH_OPTS[@]}" "$REMOTE_HOST" "chmod 644 '${REMOTE_DIR}/${ISO_FILE}.tmp' '${REMOTE_DIR}/${ISO_FILE}.sha256.tmp' '${REMOTE_DIR}/build-info.txt.tmp' && mv -f '${REMOTE_DIR}/${ISO_FILE}.tmp' '${REMOTE_DIR}/${ISO_FILE}' && mv -f '${REMOTE_DIR}/${ISO_FILE}.sha256.tmp' '${REMOTE_DIR}/${ISO_FILE}.sha256' && mv -f '${REMOTE_DIR}/build-info.txt.tmp' '${REMOTE_DIR}/build-info.txt'"

          {
            echo "### Self-Hosted ISO Published (LXC 106)"
            echo "- **Public HTTPS:** https://updates.srcdev.site/iso/${ISO_FILE}"
            echo "- **Fast LAN HTTP:** http://192.168.1.158/iso/${ISO_FILE}"
            echo "- **SHA256:** \`${ISO_SHA256}\` (${ISO_SIZE})"
            echo "- **Metadata:** https://updates.srcdev.site/iso/build-info.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      # 6. Optional: Split ISO into 1.8 GB 7-Zip volumes for GitHub Releases
      - name: Split and Compress ISO
        if: inputs.publish_github_release == true
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
          fi
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          ISO_DIR="$(dirname "$ISO_PATH")"
          ISO_FILE="$(basename "$ISO_PATH")"
          sudo chown -R "$USER:$USER" "$ISO_DIR"
          cd "$ISO_DIR"

          7z a -v1800m -mx=0 sourceless-os.7z "$ISO_FILE"
          rm -f "$ISO_FILE"
          ls -lh sourceless-os.7z.*

      # 7. Optional: Delete previous latest-iso release and tag to avoid stale volume parts
      - name: Clean Previous Release Assets
        if: inputs.publish_github_release == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-iso -y --cleanup-tag 2>/dev/null || true

      # 8. Optional: Publish split 7-Zip ISO volumes to GitHub Releases
      - name: Publish to GitHub Releases
        if: inputs.publish_github_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-iso
          name: "SourceLess OS Live ISO"
          body: "Automated 2-in-1 Live + Install ISO build. Download all parts (.001, .002...) and extract using 7-Zip or PeaZip."
          files: ${{ runner.temp }}/sourceless-os.7z.*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. Clean temporary ISO artifacts from persistent runner temp directory
      - name: Cleanup Temp ISO
        if: always()
        run: |
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          ISO_DIR="$(dirname "$ISO_PATH")"
          rm -f "$ISO_PATH" "${ISO_PATH}.sha256" "${ISO_DIR}/build-info.txt" "${ISO_DIR}"/sourceless-os.7z.* 2>/dev/null || true
