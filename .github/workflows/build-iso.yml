name: Build ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR with Podman
        run: |
          sudo podman login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Build ISO with Bootc Image Builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            -v /run/containers/0/auth.json:/run/containers/0/auth.json:ro \
            -v ./output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            ghcr.io/${{ github.repository_owner }}/sourceless-os:latest

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourceless-os-iso
          path: output/
          retention-days: 7