name: Build ISO

on:
  workflow_dispatch:

concurrency:
  group: build-iso-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Reclaim runner disk space before pulling container layers
      - name: Free Disk Space
        run: |
          echo "Free disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/aws*
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune --all --force --volumes 2>/dev/null || true
          sudo apt-get clean
          echo "Free disk space after cleanup:"
          df -h /

      # 2. Normalize image reference and detect Fedora VERSION_ID
      - name: Detect Image Metadata
        id: meta
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${IMAGE_OWNER}/sourceless-os:latest"
          echo "owner=${IMAGE_OWNER}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE_NAME"
          FEDORA_VER=$(sudo podman run --rm "$IMAGE_NAME" sh -c 'grep -E "^VERSION_ID=" /etc/os-release | cut -d= -f2 | tr -d "\""')
          if [ -z "$FEDORA_VER" ]; then
            FEDORA_VER="45"
          fi
          echo "Detected Fedora VERSION_ID=${FEDORA_VER}"
          echo "version=${FEDORA_VER}" >> "$GITHUB_OUTPUT"

      # 3. Build 2-in-1 Live + Installer ISO via Titanoboa (ublue-os/titanoboa)
      - name: Build 2-in-1 Live ISO (Titanoboa)
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          iso-dest: ${{ runner.temp }}/sourceless-os-live.iso

      # 4. Prune container images before archiving to free disk space
      - name: Reclaim Container Storage Before Compression
        run: |
          sudo podman rmi --all --force 2>/dev/null || true
          sudo podman system prune --all --force 2>/dev/null || true
          sudo docker system prune --all --force 2>/dev/null || true
          df -h /

      # 5. Split ISO into 1.8 GB 7-Zip volumes and remove raw ISO
      - name: Split and Compress ISO
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
          fi
          ISO_PATH="${{ steps.build.outputs.iso-dest }}"
          ISO_DIR="$(dirname "$ISO_PATH")"
          ISO_FILE="$(basename "$ISO_PATH")"
          sudo chown -R "$USER:$USER" "$ISO_DIR"
          cd "$ISO_DIR"

          7z a -v1800m -mx=0 sourceless-os.7z "$ISO_FILE"
          rm -f "$ISO_FILE"
          ls -lh sourceless-os.7z.*

      # 6. Delete previous latest-iso release and tag to avoid stale volume parts
      - name: Clean Previous Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-iso -y --cleanup-tag 2>/dev/null || true

      # 7. Publish split 7-Zip ISO volumes to GitHub Releases
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-iso
          name: "Sourceless OS Live ISO"
          body: "Automated 2-in-1 Live + Install ISO build. Download all parts (.001, .002...) and extract using 7-Zip or PeaZip."
          files: ${{ runner.temp }}/sourceless-os.7z.*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
