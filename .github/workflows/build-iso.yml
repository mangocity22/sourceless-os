name: Build ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Maximize disk space on GitHub Runner
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true

      # 2. Normalize repository owner to lowercase for GHCR compatibility
      - name: Set Image Name
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${IMAGE_OWNER}/sourceless-os:latest" >> $GITHUB_ENV

      # 3. Authenticate with GHCR using an explicit authfile path
      - name: Log in to GHCR
        run: |
          sudo mkdir -p /root/.config/containers
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin --authfile /root/.config/containers/auth.json

      # 4. Pull target OS image
      - name: Pull Target OS Image
        run: |
          sudo podman pull --authfile /root/.config/containers/auth.json "$IMAGE_NAME"

      # 5. Build bootable interactive ISO with Bootc Image Builder
      - name: Build ISO with Bootc Image Builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/output":/output \
            -v "$(pwd)/installer-config.toml":/config.toml:ro \
            -v /root/.config/containers/auth.json:/root/.config/containers/auth.json:ro \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs ext4 \
            --config /config.toml \
            "$IMAGE_NAME"

      # 6. Publish ISO directly to GitHub Releases (Fast CDN Delivery)
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-iso
          name: "Sourceless OS Live ISO"
          body: "Automated latest build generated by GitHub Actions."
          files: output/bootiso/install.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}