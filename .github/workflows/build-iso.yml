name: Build ISO

on:
  workflow_dispatch:

concurrency:
  group: build-iso-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Eliberare agresiva a spatiului pe runner
      - name: Free Disk Space
        run: |
          echo "Free disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/aws*
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune --all --force --volumes 2>/dev/null || true
          sudo apt-get clean
          echo "Free disk space after cleanup:"
          df -h /

      # 2. Normalizare nume imagine si detectare automata VERSION_ID (Fedora)
      - name: Detect Image Metadata
        id: meta
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${IMAGE_OWNER}/sourceless-os:latest"
          echo "owner=${IMAGE_OWNER}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE_NAME"
          FEDORA_VER=$(sudo podman run --rm "$IMAGE_NAME" sh -c 'grep -E "^VERSION_ID=" /etc/os-release | cut -d= -f2 | tr -d "\""')
          if [ -z "$FEDORA_VER" ]; then
            FEDORA_VER="41"
          fi
          echo "Detected Fedora VERSION_ID=${FEDORA_VER}"
          echo "version=${FEDORA_VER}" >> "$GITHUB_OUTPUT"

          # Eliberam imaginea trasa doar pentru inspectie ca sa pastram spatiul maxim
          sudo podman rmi --all --force 2>/dev/null || true

      # 3. Generare Installer ISO cu build-container-installer (compatibil BlueBuild & custom os-release)
      - name: Build Container Installer ISO
        id: build
        uses: jasonn3/build-container-installer@main
        with:
          arch: x86_64
          image_name: sourceless-os
          image_repo: ghcr.io/${{ steps.meta.outputs.owner }}
          image_tag: latest
          variant: Kinoite
          version: ${{ steps.meta.outputs.version }}
          iso_name: sourceless-os.iso

      # 4. Eliberare imagini container inainte de arhivare
      - name: Reclaim Container Storage Before Compression
        run: |
          sudo podman rmi --all --force 2>/dev/null || true
          sudo podman system prune --all --force 2>/dev/null || true
          sudo docker system prune --all --force 2>/dev/null || true
          df -h /

      # 5. Comprimare, split in volume de 1.8GB si curatare ISO original pentru spatiu
      - name: Split and Compress ISO
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
          fi
          ISO_DIR="${{ steps.build.outputs.iso_path }}"
          ISO_FILE="${{ steps.build.outputs.iso_name }}"
          sudo chown -R "$USER:$USER" "$ISO_DIR"
          cd "$ISO_DIR"

          7z a -v1800m -mx=0 sourceless-os.7z "$ISO_FILE"
          rm -f "$ISO_FILE"
          ls -lh sourceless-os.7z.*

      # 6. Curatare release anterior pentru a nu ramane volume vechi
      - name: Clean Previous Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-iso -y --cleanup-tag 2>/dev/null || true

      # 7. Upload volume pe GitHub Releases
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-iso
          name: "Sourceless OS Live ISO"
          body: "Automated multi-part build. Download all parts (.001, .002...) and extract using 7-Zip or PeaZip."
          files: ${{ steps.build.outputs.iso_path }}/sourceless-os.7z.*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
