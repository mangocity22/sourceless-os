name: Build ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Eliberare spatiu pe runner
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true

      # 2. Normalizare nume imagine
      - name: Set Image Name
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${IMAGE_OWNER}/sourceless-os:latest" >> $GITHUB_ENV

      # 3. Autentificare in GHCR
      - name: Log in to GHCR
        run: |
          sudo mkdir -p /root/.config/containers
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin --authfile /root/.config/containers/auth.json

      # 4. Descarcare imagine OS
      - name: Pull Target OS Image
        run: |
          sudo podman pull --authfile /root/.config/containers/auth.json "$IMAGE_NAME"

      # 5. Compilare ISO cu Bootc Image Builder
      - name: Build ISO with Bootc Image Builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/output":/output \
            -v "$(pwd)/installer-config.toml":/config.toml:ro \
            -v /root/.config/containers/auth.json:/root/.config/containers/auth.json:ro \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs ext4 \
            --config /config.toml \
            "$IMAGE_NAME"

      # 6. Comprimare si split in bucati de 1.8GB
      - name: Split and Compress ISO
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          sudo chown -R $USER:$USER output/
          cd output/bootiso
          7z a -v1800m -mx=1 sourceless-os.7z install.iso

      # 7. Upload volume pe GitHub Releases
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-iso
          name: "Sourceless OS Live ISO"
          body: "Automated multi-part build. Download all parts and extract the .001 file."
          files: output/bootiso/sourceless-os.7z.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}